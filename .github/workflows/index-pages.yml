name: Index - GitHub Pages

on:
  workflow_dispatch:
  workflow_call:
  release:
    types: [published, edited, deleted]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build PEP 503 index
    runs-on: ubuntu-latest
    steps:
      - name: Generate index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/simple/vapoursynth-ngu
          gh api --paginate "repos/${{ github.repository }}/releases" --jq '
            .[] | select(.draft | not) | .assets[]
            | select((.name | endswith(".whl")) and ((.digest // "") | startswith("sha256:")))
            | "<a href=\"\(.browser_download_url)#\(.digest | sub(":"; "="))\">\(.name)</a><br>"
          ' > links.html
          {
            echo '<!doctype html><html><body>'
            cat links.html
            echo '</body></html>'
          } > _site/simple/vapoursynth-ngu/index.html
          echo '<!doctype html><html><body><a href="vapoursynth-ngu/">vapoursynth-ngu</a></body></html>' > _site/simple/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
